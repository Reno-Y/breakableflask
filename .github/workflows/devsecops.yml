name: Automatisation des tests DevSecOps

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  Dependances:
    name: Contrôle des dépendances
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Auditer les dépendances principales
        run: pip-audit -r requirements.txt

      - name: Auditer les dépendances des bases de données
        run: pip-audit --no-deps --disable-pip -r database-requirements.txt

  Dockerfile:
    name: Contrôle du Dockerfile
    runs-on: ubuntu-latest
    needs: Dependances

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérifier la présence du Dockerfile
        run: test -f Dockerfile

      - name: Contrôler le Dockerfile avec Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Construire l'image Docker
        run: docker build --tag breakableflask:test .

  Deploy:
    name: Préparation du déploiement
    runs-on: ubuntu-latest
    needs: Dockerfile

    steps:
      - name: Déploiement
        run: echo "Rien à faire ici. Votre application est prête à être déployée."
